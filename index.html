<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Predictor - Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        button {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #38bdf8;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-special {
            grid-column: span 2;
            background: linear-gradient(90deg, #d946ef, #8b5cf6);
            color: white;
            border: none;
            font-size: 16px;
            text-transform: uppercase;
        }
        .result-box {
            margin-top: 25px;
            background-color: rgba(30, 41, 59, 0.7);
            padding: 15px;
            border-radius: 12px;
            border-top: 4px solid #38bdf8;
        }
        .match-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 10px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .match-date-time {
            color: #facc15;
            font-size: 12px;
            font-weight: bold;
        }
        .match-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .prediction-details {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .badge-prob {
            color: #4ade80;
            font-weight: bold;
        }
        .badge-bookie {
            background-color: #2563eb;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 5px;
        }
        .total-odds-box {
            margin-top: 20px;
            background-color: #10b981;
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .loading-text {
            text-align: center;
            color: #facc15;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Pro Predictor</h1>
        <div class="subtitle">Chagua Odds Zako Za Leo</div>

        <div class="btn-grid">
            <button onclick="filterOdds(1.50)">Odds 1.50</button>
            <button onclick="filterOdds(2.00)">Odds 2.00</button>
            <button onclick="filterOdds(3.50)">Odds 3.00 - 4.00</button>
            <button onclick="filterOdds(6.00)">Odds 5.00 - 7.00</button>
            <button onclick="filterOdds(20.00)" style="grid-column: span 2;">Odds 20.00+</button>
            <button onclick="filterOdds(300.00)" class="btn-special">Target: Odds 300+</button>
        </div>

        <div class="result-box" id="predictionResult">
            <div id="matchesOutput" class="loading-text">
                Connecting to live servers... Please wait.
            </div>
        </div>
    </div>

    <script>
        let analyzedMatches = [];
        const bookmakers = ["1Win", "SportPesa", "betPawa", "SportyBet", "Betway"];

        function getTodayDate() {
            let today = new Date();
            let dd = String(today.getDate()).padStart(2, '0');
            let mm = String(today.getMonth() + 1).padStart(2, '0');
            let yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function runAIAnalysis(fixture) {
            let winProb = Math.floor(Math.random() * 30) + 60; // Probability between 60% and 90%

            let pick = "Over 1.5 Goals";
            if (winProb > 80) {
                pick = "Home Win (1)";
            } else if (winProb < 70) {
                pick = "Both Teams to Score (GG)";
            } else {
                pick = "Over 2.5 Goals";
            }

            let calculatedOdd = ((100 / winProb) * 0.92).toFixed(2);
            if (calculatedOdd < 1.15) calculatedOdd = 1.25;

            let randomBookie = bookmakers[Math.floor(Math.random() * bookmakers.length)];

            return {
                homeTeam: fixture.homeTeam,
                awayTeam: fixture.awayTeam,
                league: fixture.league || "League",
                matchDate: getTodayDate(),
                matchTime: fixture.matchTime || "22:00",
                prediction: pick,
                probability: winProb + "%",
                odd: parseFloat(calculatedOdd),
                bookmaker: randomBookie
            };
        }

        async function fetchLiveMatches() {
            const output = document.getElementById("matchesOutput");
            output.innerHTML = "Fetching live global fixtures... Please wait.";

            let today = new Date().toISOString().split('T')[0];

            try {
                // Corrected RapidAPI endpoint and headers
                let response = await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?date=${today}`, {
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "api-football-v1.p.rapidapi.com",
                        "x-rapidapi-key": "4fab3212c3msha71c12ec174b354p1009e7jsnfd9cc011cbf0" 
                    }
                });
                
                if (response.ok) {
                    let data = await response.json();
                    
                    if (data.errors && Object.keys(data.errors).length > 0) {
                        output.innerHTML = "<span style='color: #f87171;'>⚠️ API Error: Ensure you have clicked 'Subscribe' on the Basic (Free) plan in RapidAPI for API-Football.</span>";
                        return;
                    }

                    if (data.response.length === 0) {
                        output.innerHTML = "No live fixtures found for today in the database.";
                        return;
                    }

                    let liveFixtures = data.response.slice(0, 30); // Grab top 30 matches

                    analyzedMatches = liveFixtures.map(match => runAIAnalysis({
                        homeTeam: match.teams.home.name,
                        awayTeam: match.teams.away.name,
                        league: match.league.name,
                        matchTime: new Date(match.fixture.date).toLocaleTimeString('sw-TZ', {hour: '2-digit', minute:'2-digit'})
                    }));
                    
                    output.innerHTML = "<span style='color: #4ade80;'>✅ Live matches successfully loaded! Select your target odds above.</span>";
                } else {
                    throw new Error("API integration failed or Key is invalid.");
                }
            } catch (error) {
                // Offline fallback data to test UI
                let fallbackFixtures = [
                    { homeTeam: "Arsenal", awayTeam: "Aston Villa", matchTime: "17:30", league: "Premier League" },
                    { homeTeam: "Real Madrid", awayTeam: "Sevilla", matchTime: "20:00", league: "La Liga" },
                    { homeTeam: "Bayern Munich", awayTeam: "RB Leipzig", matchTime: "16:30", league: "Bundesliga" },
                    { homeTeam: "Inter Milan", awayTeam: "AS Roma", matchTime: "21:45", league: "Serie A" },
                    { homeTeam: "PSG", awayTeam: "AS Monaco", matchTime: "22:00", league: "Ligue 1" },
                    { homeTeam: "Liverpool", awayTeam: "Chelsea", matchTime: "19:30", league: "Premier League" },
                    { homeTeam: "Barcelona", awayTeam: "Valencia", matchTime: "23:00", league: "La Liga" }
                ];
                analyzedMatches = fallbackFixtures.map(match => runAIAnalysis(match));
                output.innerHTML = "<span style='color: #facc15;'>⚠️ Network unavailable. Using offline fallback data. Select your odds above.</span>";
            }
        }

        function filterOdds(targetOdd) {
            const output = document.getElementById("matchesOutput");
            if (analyzedMatches.length === 0) {
                output.innerHTML = "Processing fixtures... Please wait.";
                return;
            }

            // Shuffle array to ensure unique accumulator slips
            let shuffledMatches = analyzedMatches.sort(() => 0.5 - Math.random());
            let selected = [];
            let currentOdd = 1.0;

            for (let match of shuffledMatches) {
                if (currentOdd * match.odd <= targetOdd * 1.5) { 
                    selected.push(match);
                    currentOdd *= match.odd;
                    if (currentOdd >= targetOdd * 0.90) break; 
                }
            }

            let html = ``;

            selected.forEach(m => {
                html += `
                    <div class="match-card">
                        <div class="match-header">
                            <span style="font-size:12px; color:#cbd5e1;">🏆 ${m.league} | 📅 ${m.matchDate}</span>
                            <span class="match-date-time">⏰ ${m.matchTime}</span>
                        </div>
                        <div class="match-title">⚽ ${m.homeTeam} vs ${m.awayTeam}</div>
                        <div class="prediction-details">
                            🎯 Prediction: <b style="color: #ffffff;">${m.prediction}</b><br>
                            📊 Value: <b>${m.odd.toFixed(2)}</b> <span class="badge-bookie">${m.bookmaker}</span><br>
                            📈 Win Probability: <span class="badge-prob">${m.probability}</span>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="total-odds-box">
                    Total Odds: ${currentOdd.toFixed(2)}
                </div>
            `;

            output.innerHTML = html;
        }

        fetchLiveMatches();
    </script>
</body>
</html>
